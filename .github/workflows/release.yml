name: Build and Release Userscript

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # This sets the default directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: userscript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Points the cacher to the package.json inside the subdirectory
          cache: 'npm'
          cache-dependency-path: userscript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production script
        run: npm run build:prod

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Note: The 'files' property is handled by the action itself, 
          # which runs from the repository root, so we include the folder prefix here.
          files: |
            userscript/dist/*
          generate_release_notes: true
